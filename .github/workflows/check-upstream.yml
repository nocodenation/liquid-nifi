name: Check upstream NiFi

on:
  schedule:
    - cron: "17 2 * * *"        # daily 02:17 UTC
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Build this exact tag, skipping detection (e.g. 2.9.0)"
        required: false
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag to build
        id: detect
        run: |
          set -euo pipefail

          FORCE="${{ github.event.inputs.force_tag }}"
          if [ -n "$FORCE" ]; then
            echo "Forced tag: $FORCE"
            echo "tag=$FORCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Upstream 2.x release tags, newest semver first.
          upstream=$(curl -s \
            "https://hub.docker.com/v2/repositories/apache/nifi/tags?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^2\.[0-9]+\.[0-9]+$' | sort -Vr)

          owner="${{ github.repository_owner }}"
          tag=""
          for t in $upstream; do
            # First (highest) upstream tag we have NOT yet published wins.
            if docker manifest inspect "ghcr.io/${owner}/liquid-nifi:${t}" >/dev/null 2>&1; then
              echo "Already published: ${t} (stopping; nothing newer is missing)"
              break
            fi
            tag="$t"
            break
          done

          if [ -n "$tag" ]; then
            echo "New tag to build: $tag"
          else
            echo "Up to date — nothing to build."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.tag != '' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-and-publish.yml
    with:
      nifi_tag: ${{ needs.detect.outputs.tag }}
    secrets:
      AGE_SSH_KEY_B64: ${{ secrets.AGE_SSH_KEY_B64 }}
